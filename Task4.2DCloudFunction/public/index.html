<!DOCTYPE html>
<html>

<head>

    <title>Home Lighting Control</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">

    <div class="max-w-3xl mx-auto mt-12">

        <h1 class="text-3xl font-bold text-center mb-8">
            Home Lighting Control
        </h1>


        <div class="grid grid-cols-3 gap-5">


            <div class="bg-white p-6 rounded-lg shadow text-center">

                <h2 class="text-xl font-semibold mb-4">
                    Living Room
                </h2>

                <button
                    onclick="toggleLight('living room')"
                    class="bg-blue-600 text-white px-5 py-2 rounded"
                >
                    Toggle
                </button>

            </div>


            <div class="bg-white p-6 rounded-lg shadow text-center">

                <h2 class="text-xl font-semibold mb-4">
                    Bathroom
                </h2>

                <button
                    onclick="toggleLight('bathroom')"
                    class="bg-blue-600 text-white px-5 py-2 rounded"
                >
                    Toggle
                </button>

            </div>


            <div class="bg-white p-6 rounded-lg shadow text-center">

                <h2 class="text-xl font-semibold mb-4">
                    Closet
                </h2>

                <button
                    onclick="toggleLight('closet')"
                    class="bg-blue-600 text-white px-5 py-2 rounded"
                >
                    Toggle
                </button>

            </div>

        </div>


        <p id="status" class="text-center mt-8">
            Ready
        </p>

    </div>


    <script>

        async function toggleLight(room) {

            document.getElementById("status").textContent =
                "Sending command...";


            try {

                const response = await fetch("/api/light", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        room: room
                    })

                });


                const result = await response.json();


                if (result.success) {

                    document.getElementById("status").textContent =
                        result.message;

                }

                else {

                    document.getElementById("status").textContent =
                        result.error;

                }

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Connection error";

            }

        }

    </script>

</body>

</html>
